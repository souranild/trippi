<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(38, 38, 38, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .kinetic-title {
            letter-spacing: -0.04em;
            line-height: 0.9;
        }
        .neotactile-card {
            background: #191919;
            box-shadow: 
                inset 1px 1px 1px rgba(255,255,255,0.05),
                inset -1px -1px 1px rgba(0,0,0,0.4),
                8px 8px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .map-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #c3f400;
            border-radius: 50%;
            box-shadow: 0 0 12px #c3f400;
        }
        .map-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .map-marker:hover {
            transform: translate(-50%, -110%) scale(1.1);
            z-index: 20;
        }
        .flag-box {
            background: #191919;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .marker-stem {
            width: 2px;
            height: 10px;
            background: linear-gradient(to bottom, #c3f400, transparent);
        }
        .marker-glow {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #c3f400;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.5;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.8); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .world-map-svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4) contrast(1.2) hue-rotate(180deg) invert(1);
            opacity: 0.15;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0e0e0e; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8ff5ff; }
    </style>
</head>

<span class="material-symbols-outlined">notifications</span>
